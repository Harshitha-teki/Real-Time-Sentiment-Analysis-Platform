services:
  # 1. Database Service
  db:
    image: postgres:15-alpine
    env_file: .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Message Queue
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 3. Backend API
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    # This command ensures the container stays alive
    command: python main.py
    restart: always

  # 4. Worker (AI Processing)
  worker:
    build: ./worker
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    restart: always

  # 5. Ingester (Data Simulation)
  ingester:
    build: ./ingester
    depends_on:
      redis:
        condition: service_healthy
    env_file: .env
    restart: always

  # 6. Frontend
  frontend:
    build: ./frontend
    ports:
      - "3000:5173"
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data: